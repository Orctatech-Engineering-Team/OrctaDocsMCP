services:
  qdrant:
    image: qdrant/qdrant:latest
    restart: always
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  mcp:
    build: .
    restart: always
    ports:
      - "8000:8000"   # MCP SSE server
      - "8001:8001"   # health check
    env_file:
      - .env
    depends_on:
      - qdrant
    command: python -m mcp.server

  # run manually when you want to re-index
  ingest:
    build: .
    env_file:
      - .env
    depends_on:
      - qdrant
    profiles:
      - ingest         # only runs when explicitly called
    command: python -m ingestion.ingest

volumes:
  qdrant_data: