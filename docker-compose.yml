services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: always
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: docs
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  valkey:
    image: valkey/valkey:latest
    restart: always
    ports:
      - "6379:6379"

  mcp:
    build: .
    restart: always
    ports:
      - "8000:8000"   # MCP server
      - "8001:8001"   # health check
    env_file:
      - .env
    depends_on:
      - postgres
      - valkey
    command: python -m mcp.server

  ingest:
    build: .
    env_file:
      - .env
    depends_on:
      - postgres
    profiles:
      - ingest
    command: python -m ingestion.ingest

volumes:
  postgres_data: